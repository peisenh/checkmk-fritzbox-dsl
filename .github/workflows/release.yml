name: Release

# Triggered by pushing a version tag (e.g. v0.2.0).
# Version comes from the tag; release notes come from the matching CHANGELOG.md
# section. Runs on BOTH GitHub Actions and Gitea Actions: the release is created
# via the platform's REST API with curl, so no `gh` CLI or platform-specific
# actions are needed. The two APIs share the same release endpoint and JSON
# fields; only the base URL and auth header syntax differ, which the "Create
# release" step derives from GITHUB_SERVER_URL at run time.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"        # v0.2.0 -> 0.2.0
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { f=1; next }   # version header: start printing
            f && /^## \[/            { exit }         # next version block: stop
            f                        { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No CHANGELOG section found for $VERSION." >&2
            exit 1
          fi

      - name: Create release
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}       # owner/repo
        run: |
          set -euo pipefail

          # --- detect platform ------------------------------------------------
          # GITHUB_SERVER_URL is https://github.com on GitHub Actions and the
          # instance URL (e.g. https://gitea.example.com) on Gitea Actions.
          if [ "${GITHUB_SERVER_URL:-}" = "https://github.com" ]; then
            API="https://api.github.com/repos/${REPO}/releases"
            AUTH="Authorization: Bearer ${TOKEN}"
            echo "Platform: GitHub -> ${API}"
          else
            API="${GITHUB_SERVER_URL%/}/api/v1/repos/${REPO}/releases"
            AUTH="Authorization: token ${TOKEN}"
            echo "Platform: Gitea -> ${API}"
          fi

          # --- semver pre-release? (tag contains '-', e.g. v0.2.0-rc1) --------
          case "$GITHUB_REF_NAME" in
            *-*) PRE=true ;;
            *)   PRE=false ;;
          esac

          # --- build the JSON body (Python escapes the changelog text safely;
          #     python3 is always present - jq is not guaranteed on Gitea). The
          #     heredoc body is written to a file first so its indentation is
          #     not tied to the YAML block indentation.
          cat > build_body.py <<'PYEOF'
          import json, os
          tag = os.environ["GITHUB_REF_NAME"]
          pre = os.environ["PRE"] == "true"
          notes = open("release-body.md", encoding="utf-8").read()
          print(json.dumps({
              "tag_name": tag, "name": tag, "body": notes,
              "draft": False, "prerelease": pre,
          }))
          PYEOF
          BODY_JSON=$(PRE="$PRE" python3 build_body.py)

          # --- create the release --------------------------------------------
          HTTP=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$API" \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d "$BODY_JSON")

          echo "HTTP $HTTP"
          if [ "$HTTP" != "201" ]; then
            echo "Release creation failed:" >&2
            cat response.json >&2
            exit 1
          fi
          echo "Release created for $GITHUB_REF_NAME."
